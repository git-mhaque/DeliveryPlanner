reporting:
  overall_health: at_risk # Valid options: on_track, at_risk, blocked, unknown
  health_note: Q2 is holding. Capacity and tenant-isolation decisions put two Q3 outcomes at risk.
  highlights:
  - The indexing foundation and relevance baseline are complete; pilot integration is progressing.
  - Both pilot cohorts are prepared. Permission verification is the final gate before access.
  - Audit coverage is restored, with no change to the planned pilot date.
  changes_since_last_report:
  - Pilot onboarding and audit remediation moved to Done.
  - Recovery rehearsal was added as unplanned work after the readiness review.
  - Semantic preview is At risk pending the compute-capacity decision.
  risks:
  - id: compute-capacity
    title: Semantic preview capacity
    severity: high # Valid options: low, medium, high
    owner: Platform Engineering Lead
    milestone_ids:
    - embeddings-capacity
    - semantic-preview
    mitigation: Reserve a smaller capacity block and reduce the preview cohort if full funding is delayed.
  - id: ownership-contract
    title: Tenant ownership decision
    severity: high # Valid options: low, medium, high
    owner: Trust & Security Lead
    milestone_ids:
    - tenant-isolation
    - federated-search
    mitigation: Resolve the shared-workspace ownership contract before implementation resumes.
  - id: consumer-capacity
    title: Client migration capacity
    severity: medium # Valid options: low, medium, high
    owner: Developer Enablement Lead
    milestone_ids:
    - sdk-migration
    mitigation: Stage the migration by consumer and retain compatibility through the pilot exit.
  decisions_needed:
  - id: capacity-reservation
    title: Approve the compute reservation
    owner: Programme Sponsor
    due_date: '2026-10-30'
    status: open # Valid options: open, resolved
    milestone_ids:
    - embeddings-capacity
    ask: Choose full preview capacity or the smaller cohort fallback for Q3.
  - id: tenant-contract
    title: Confirm shared-workspace ownership
    owner: Product & Trust Leads
    due_date: '2026-11-05'
    status: open # Valid options: open, resolved
    milestone_ids:
    - tenant-isolation
    ask: Agree the ownership and exception model so isolation implementation can resume.
  - id: pilot-cohorts
    title: Select the initial pilot cohorts
    owner: Product Lead
    due_date: '2026-10-16'
    status: resolved # Valid options: open, resolved
    milestone_ids:
    - pilot-onboarding
    ask: Two fictional cohorts were selected with agreed success criteria.

