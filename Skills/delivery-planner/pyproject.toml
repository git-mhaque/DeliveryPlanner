[project]
name = "delivery-planner"
version = "1.0.0"
description = "Reproducible multi-team delivery plans from YAML"
requires-python = ">=3.9"
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.25.1",
  "Jinja2==3.1.6",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
